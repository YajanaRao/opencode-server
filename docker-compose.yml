version: '3.8'

services:
  opencode-server:
    build: .
    container_name: opencode-server
    ports:
      - "4096:4096"
    environment:
      - PORT=4096
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-changeme}
      - OPENCODE_SERVER_USERNAME=admin
      - NODE_ENV=production
      # Optional: Add GITHUB_TOKEN if you have a Notes repository
      # - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      # Persistent storage for scheduler state and job definitions
      - opencode-config:/home/opencode/.config/opencode
      # Persistent storage for logs
      - opencode-logs:/home/opencode/.config/opencode/logs
      # Optional: Mount your workspace if you want access to local files
      # - ./workspace:/home/opencode/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096/global/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  opencode-config:
    driver: local
  opencode-logs:
    driver: local

