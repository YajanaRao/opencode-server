version: '3.8'

services:
  opencode-server:
    build: .
    container_name: opencode-server
    ports:
      - "4096:4096"
    environment:
      - PORT=4096
      # No default on purpose. This used to fall back to "changeme", which
      # silently published a shell-capable agent behind a known password.
      # Unset now means the entrypoint refuses to start.
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD before running docker-compose}
      - OPENCODE_SERVER_USERNAME=admin
      - NODE_ENV=production
      # OpenCode Zen API key 
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      # Optional: Add GITHUB_TOKEN if you have a Notes repository
      # - GITHUB_TOKEN=${GITHUB_TOKEN}
    volumes:
      # Persistent storage for scheduler state and job definitions
      - opencode-config:/home/opencode/.config/opencode
      # Persistent storage for logs
      - opencode-logs:/home/opencode/.config/opencode/logs
      # Optional: Mount your workspace if you want access to local files
      # - ./workspace:/home/opencode/workspace
    restart: unless-stopped
    healthcheck:
      # Accept 401 as healthy - basic auth is always on, and an unauthenticated
      # probe returning 401 proves the server is up and enforcing auth.
      # CMD-SHELL (not CMD) so the pipe is interpreted.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:4096/global/health | grep -qE '^(200|401)$$'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  opencode-config:
    driver: local
  opencode-logs:
    driver: local

